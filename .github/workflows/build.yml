name: Build GREEN SHARK APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK from ZIP
        run: |
          rm -rf build_temp
          mkdir -p build_temp
          unzip -o *.zip -d build_temp
          PROJ_DIR=$(find build_temp -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then
            echo "gradlew not found in zip"
            exit 1
          fi
          cd "$PROJ_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-shark-apk
          path: "**/*.apk"
          if-no-files-found: ignore
          
